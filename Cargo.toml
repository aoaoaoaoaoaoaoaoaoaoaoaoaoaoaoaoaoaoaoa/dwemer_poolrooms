[package]
name = "brass_poolrooms"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "behind egui's façade, you find mysterious poolrooms. step in?"
documentation = "https://docs.rs/brass_poolrooms"
repository = "https://github.com/aoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoa/brass_poolrooms"
homepage = "https://github.com/aoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoa/brass_poolrooms"
keywords = ["egui", "wgpu", "gui", "shader"]
categories = ["gui", "graphics", "rendering"]
include = [
  "src/**",
  "build/**",
  "build.rs",
  "examples/**",
  "web/**",
  "docs/**",
  "scripts/gallery-service",
  "scripts/web-gallery",
  "assets/**",
  "LICENSE*",
  "/README.md",
]

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "login_surface"
required-features = ["water"]

[[example]]
name = "slider_gallery"
required-features = ["water"]

[[example]]
name = "date_spool_gallery"
required-features = ["water"]

[[example]]
name = "checkbox_gallery"
required-features = ["water"]

[[example]]
name = "corner_close_gallery"
required-features = ["water"]

[[example]]
name = "drag_handle_gallery"
required-features = ["water"]

[[example]]
name = "number_input_gallery"
required-features = ["water"]

[[example]]
name = "material_study_gallery"
required-features = ["water"]

[[example]]
name = "longinus_cursor_gallery"
required-features = ["water"]

[[example]]
name = "widget_gallery"
required-features = ["water"]

[workspace]
members = ["foundry"]
exclude = [
  "tools/web-chrome-forge",
  "tools/web-floor-forge",
  "vendor/egui-winit-0.36.1",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.96"
version = "0.14.2"

[features]
default = ["water"]
instrumentation = []
water = ["dep:anyhow", "dep:bytemuck", "dep:egui-wgpu", "dep:web-time"]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
brass_foundry = { version = "0.14.2", path = "foundry" }
bytemuck = { version = "1.25.2", features = ["derive"], optional = true }
egui = "=0.36.1"
egui-wgpu = { version = "=0.36.1", optional = true, default-features = false }
web-time = { version = "1.1.0", optional = true }

[build-dependencies]
brass_foundry = { version = "0.14.2", path = "foundry" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
egui-wgpu = { version = "=0.36.1", optional = true, default-features = false, features = ["fragile-send-sync-non-atomic-wasm"] }

[dev-dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
egui-winit = { version = "=0.36.1", default-features = false, features = ["x11"] }
pollster = "1.0"

[target.'cfg(target_os = "linux")'.dev-dependencies]
wgpu = { version = "30.0.0", default-features = false, features = ["std", "vulkan", "wgsl"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
wgpu = { version = "30.0.0", default-features = false, features = ["metal", "std", "wgsl"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
wgpu = { version = "30.0.0", default-features = false, features = ["dx12", "std", "wgsl"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
console_error_panic_hook = "0.1.7"
egui-winit-wasm = { package = "egui-winit", path = "vendor/egui-winit-0.36.1", version = "=0.36.1", default-features = false }
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
web-sys = { version = "=0.3.104", features = [
  "Document",
  "Element",
  "HtmlCanvasElement",
  "Node",
  "Window",
  "console",
] }
wgpu = { version = "30.0.0", default-features = false, features = ["std", "webgpu", "wgsl"] }

[lints]
workspace = true

[workspace.lints.rust]
warnings = "deny"
elided_lifetimes_in_paths = "deny"
unexpected_cfgs = "deny"
unsafe_code = "deny"
unused_crate_dependencies = "warn"
unused_lifetimes = "deny"
unused_qualifications = "deny"
unused_results = "deny"
ambiguous_glob_imports = "allow"
ambiguous_glob_reexports = "allow"
hidden_glob_reexports = "allow"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -2 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -3 }

dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
allow_attributes_without_reason = "deny"

cargo_common_metadata = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"

enum_glob_use = "allow"
wildcard_imports = "allow"

items_after_statements = "allow"
many_single_char_names = "allow"
match_same_arms = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
struct_field_names = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
unnested_or_patterns = "allow"

cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
float_cmp = "allow"
implicit_hasher = "allow"
manual_let_else = "allow"
map_unwrap_or = "allow"
uninlined_format_args = "allow"

ignored_unit_patterns = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
no_effect_underscore_binding = "allow"
redundant_closure_for_method_calls = "allow"
ref_option = "allow"
return_self_not_must_use = "allow"
trivially_copy_pass_by_ref = "allow"
unused_async = "allow"
used_underscore_binding = "allow"

[workspace.metadata.rust-starter]
format_command = ["cargo", "fmt", "--all", "--check"]
clippy_command = [
  "cargo",
  "clippy",
  "--workspace",
  "--all-targets",
  "--all-features",
]
test_command = ["cargo", "test", "--workspace", "--all-targets", "--all-features"]
doc_command = ["cargo", "doc", "--workspace", "--all-features", "--no-deps"]
web_command = ["scripts/check-web"]
canonicalize_commands = [
  [
    "cargo",
    "fix",
    "--workspace",
    "--all-targets",
    "--all-features",
    "--allow-dirty",
    "--allow-staged",
    "--allow-no-vcs",
  ],
  [
    "cargo",
    "clippy",
    "--fix",
    "--workspace",
    "--all-targets",
    "--all-features",
    "--allow-dirty",
    "--allow-staged",
    "--allow-no-vcs",
  ],
  ["cargo", "fmt", "--all"],
]

[workspace.metadata.rust-starter.source_files]
max_lines = 3000
include = ["*.rs", "**/*.rs"]
exclude = []
